<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故障分析 - 汽车故障诊断系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-gradient: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            --card-bg: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --accent-color: #48bb78;
            --border-radius: 10px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            color: var(--text-primary);
        }
        
        .header {
            background: var(--primary-gradient);
            color: white;
            padding: 15px 0;
            box-shadow: var(--shadow);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-role {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        
        .nav-links {
            display: flex;
            gap: 10px;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            transition: background 0.3s;
        }
        
        .nav-links a:hover, .nav-links a.active {
            background: rgba(255,255,255,0.2);
        }
        
        .dashboard {
            padding: 30px 0;
        }
        
        .welcome-section {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .welcome-section h1 {
            color: var(--accent-color);
            margin-bottom: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
        }
        
        .chart-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }
        
        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            text-align: center;
        }
        
        .chart-container {
            height: 300px;
            width: 100%;
        }
        
        .info-section {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-top: 30px;
        }
        
        .info-section h3 {
            color: var(--accent-color);
            margin-bottom: 15px;
        }
        
        .info-section p {
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="nav">
                <div class="logo">汽车故障诊断系统</div>
                
                <div class="nav-links">
                    <a href="/user/dashboard">仪表板</a>
                    <a href="/user/analysis" class="active">故障分析</a>
                    <a href="/user/cost-analysis">成本分析</a>
                    <a href="/user/maintenance">维修记录</a>
                    <a href="/user/profile">个人资料</a>
                    <a href="/logout">退出登录</a>
                </div>
                
                <div class="user-info">
                    <span class="user-name">{{ session.username }}</span>
                    <span class="user-role">用户</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="dashboard">
            <div class="welcome-section">
                <h1>故障分析报告</h1>
                <p>基于系统数据分析，为您展示汽车故障的统计信息和趋势</p>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalFaults">0</div>
                    <div class="stat-label">总故障记录</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="avgCost">0</div>
                    <div class="stat-label">平均维修成本(元)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="carModels">0</div>
                    <div class="stat-label">涉及车型</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="faultTypes">0</div>
                    <div class="stat-label">故障类型</div>
                </div>
            </div>
            
            <div class="charts-grid">
                <div class="chart-card">
                    <div class="chart-title">故障类型分布</div>
                    <div class="chart-container" id="categoryChart"></div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">车型故障统计</div>
                    <div class="chart-container" id="modelChart"></div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">常见故障原因</div>
                    <div class="chart-container" id="reasonChart"></div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">维修成本分布</div>
                    <div class="chart-container" id="costChart"></div>
                </div>
            </div>
            
            <div class="info-section">
                <h3>💡 故障分析说明</h3>
                <p>• 本页面展示系统收集的汽车故障统计数据，帮助您了解常见故障类型和维修成本</p>
                <p>• 数据基于真实维修记录分析，为您提供参考信息</p>
                <p>• 如需详细分析或个性化建议，请联系系统管理员</p>
            </div>
        </div>
    </div>

    <script>
        let chartInstances = {};
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            loadAnalysisData();
        });
        
        // 初始化图表
        function initCharts() {
            chartInstances.categoryChart = echarts.init(document.getElementById('categoryChart'));
            chartInstances.modelChart = echarts.init(document.getElementById('modelChart'));
            chartInstances.reasonChart = echarts.init(document.getElementById('reasonChart'));
            chartInstances.costChart = echarts.init(document.getElementById('costChart'));
            
            // 响应式调整
            window.addEventListener('resize', () => {
                Object.values(chartInstances).forEach(chart => chart.resize());
            });
        }
        
        // 加载分析数据
        async function loadAnalysisData() {
            try {
                const response = await fetch('/api/analysis/report');
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    
                    // 更新统计数字
                    updateStats(data);
                    
                    // 渲染图表
                    renderCharts(data);
                } else {
                    console.error('API返回失败:', result.error);
                    renderDefaultCharts();
                }
            } catch (error) {
                console.error('加载分析数据失败:', error);
                renderDefaultCharts();
            }
        }
        
        // 更新统计数字
        function updateStats(data) {
            // 总故障记录
            if (data.fault_category && data.fault_category.length > 0) {
                const totalFaults = data.fault_category.reduce((sum, item) => sum + (item.fault_count || 0), 0);
                document.getElementById('totalFaults').textContent = totalFaults;
            }
            
            // 平均维修成本
            if (data.stats && data.stats.avg_cost) {
                document.getElementById('avgCost').textContent = Math.round(data.stats.avg_cost);
            } else if (data.fault_reason && data.fault_reason.length > 0) {
                const avgCost = data.fault_reason.reduce((sum, item) => sum + (item.avg_cost || 0), 0) / data.fault_reason.length;
                document.getElementById('avgCost').textContent = Math.round(avgCost);
            }
            
            // 涉及车型
            if (data.car_model && data.car_model.length > 0) {
                document.getElementById('carModels').textContent = data.car_model.length;
            }
            
            // 故障类型
            if (data.fault_category && data.fault_category.length > 0) {
                document.getElementById('faultTypes').textContent = data.fault_category.length;
            }
        }
        
        // 渲染图表
        function renderCharts(data) {
            renderCategoryChart(data.fault_category || []);
            renderModelChart(data.car_model || []);
            renderReasonChart(data.fault_reason || []);
            renderCostChart(data.fault_reason || []);
        }
        
        // 渲染故障类型分布图
        function renderCategoryChart(categoryData) {
            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{a} <br/>{b}: {c} 次 ({d}%)'
                },
                legend: {
                    orient: 'vertical',
                    right: 10,
                    top: 'center'
                },
                series: [{
                    name: '故障类型',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['40%', '50%'],
                    itemStyle: {
                        borderRadius: 10,
                        borderColor: '#fff',
                        borderWidth: 2
                    },
                    label: {
                        show: false
                    },
                    emphasis: {
                        label: {
                            show: true,
                            fontSize: '14',
                            fontWeight: 'bold'
                        }
                    },
                    data: categoryData.map(item => ({
                        value: item.fault_count,
                        name: item.category_name
                    }))
                }]
            };
            
            chartInstances.categoryChart.setOption(option);
        }
        
        // 渲染车型故障统计图
        function renderModelChart(modelData) {
            const topModels = modelData.slice(0, 8);
            const xData = topModels.map(item => item.car_model);
            const faultData = topModels.map(item => item.fault_count);
            
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                xAxis: {
                    type: 'category',
                    data: xData,
                    axisLabel: {
                        rotate: 45
                    }
                },
                yAxis: {
                    type: 'value',
                    name: '故障次数'
                },
                series: [{
                    name: '故障次数',
                    type: 'bar',
                    data: faultData,
                    itemStyle: {
                        color: '#48bb78'
                    }
                }]
            };
            
            chartInstances.modelChart.setOption(option);
        }
        
        // 渲染故障原因图
        function renderReasonChart(reasonData) {
            const topReasons = reasonData.slice(0, 10);
            const xData = topReasons.map(item => item.fault_code || item.reason_name || '未知');
            const costData = topReasons.map(item => item.avg_cost || 0);
            
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                xAxis: {
                    type: 'category',
                    data: xData,
                    axisLabel: {
                        rotate: 45
                    }
                },
                yAxis: {
                    type: 'value',
                    name: '平均成本(元)'
                },
                series: [{
                    name: '平均成本',
                    type: 'bar',
                    data: costData,
                    itemStyle: {
                        color: '#4299e1'
                    }
                }]
            };
            
            chartInstances.reasonChart.setOption(option);
        }
        
        // 渲染维修成本分布图
        function renderCostChart(reasonData) {
            const costRanges = [
                {range: '0-200', count: 0},
                {range: '201-500', count: 0},
                {range: '501-1000', count: 0},
                {range: '1001-2000', count: 0},
                {range: '2000+', count: 0}
            ];
            
            reasonData.forEach(item => {
                const cost = item.avg_cost || 0;
                if (cost <= 200) costRanges[0].count++;
                else if (cost <= 500) costRanges[1].count++;
                else if (cost <= 1000) costRanges[2].count++;
                else if (cost <= 2000) costRanges[3].count++;
                else costRanges[4].count++;
            });
            
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                xAxis: {
                    type: 'category',
                    data: costRanges.map(item => item.range)
                },
                yAxis: {
                    type: 'value',
                    name: '故障数量'
                },
                series: [{
                    name: '故障数量',
                    type: 'bar',
                    data: costRanges.map(item => item.count),
                    itemStyle: {
                        color: '#ed8936'
                    }
                }]
            };
            
            chartInstances.costChart.setOption(option);
        }
        
        // 默认图表数据
        function renderDefaultCharts() {
            const defaultCategory = [
                {category_name: '动力系统故障', fault_count: 45},
                {category_name: '底盘系统故障', fault_count: 38},
                {category_name: '车身系统故障', fault_count: 28}
            ];
            
            const defaultModel = [
                {car_model: '丰田卡罗拉', fault_count: 15},
                {car_model: '大众朗逸', fault_count: 12},
                {car_model: '本田思域', fault_count: 10}
            ];
            
            const defaultReason = [
                {fault_code: 'P0301', avg_cost: 380},
                {fault_code: 'C0045', avg_cost: 260},
                {fault_code: 'P0171', avg_cost: 420}
            ];
            
            renderCategoryChart(defaultCategory);
            renderModelChart(defaultModel);
            renderReasonChart(defaultReason);
            renderCostChart(defaultReason);
        }
    </script>
</body>
</html>
